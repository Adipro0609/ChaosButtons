<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHAOS BUTTON</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            transition: background 0.8s ease;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.5s ease;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6rem);
            margin: 0 0 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        p {
            font-size: 1.1rem;
            opacity: 0.75;
        }

        #chaosButton {
            margin-top: 30px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid white;
            background: linear-gradient(135deg, #ff0055, #7b00ff);
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                0 0 20px #ff0055,
                0 0 60px #7b00ff;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        #chaosButton:hover {
            transform: scale(1.08);
            box-shadow:
                0 0 30px #ff0055,
                0 0 90px #7b00ff;
        }

        #chaosButton:active {
            transform: scale(0.9);
        }

        #counter {
            margin-top: 25px;
            font-size: 1.2rem;
        }

        .emoji {
            position: fixed;
            font-size: 3rem;
            pointer-events: none;
            animation: fly 2s forwards;
            z-index: 10;
        }

        @keyframes fly {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }

            100% {
                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    rotate(720deg)
                    scale(0);
                opacity: 0;
            }
        }

        .particle {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 1s forwards;
            z-index: 20;
        }

        @keyframes explode {
            from {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            to {
                transform:
                    translate(var(--x), var(--y))
                    scale(0);
                opacity: 0;
            }
        }

        .flash {
            position: fixed;
            inset: 0;
            background: white;
            pointer-events: none;
            z-index: 100;
            animation: flash 0.25s forwards;
        }

        @keyframes flash {
            from { opacity: 0.8; }
            to { opacity: 0; }
        }

        .secret {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            color: #00ff66;
            font-family: monospace;
            font-size: clamp(2rem, 7vw, 6rem);
            z-index: 999;
            text-shadow: 0 0 20px #00ff66;
            animation: secretAppear 0.5s;
        }

        @keyframes secretAppear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .miniGame {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }

        .gameBox {
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            background: #222;
            box-shadow: 0 0 40px #00ffff;
        }

        #target {
            position: fixed;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: #00ffff;
            box-shadow: 0 0 30px #00ffff;
            cursor: pointer;
        }

        .scene {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background 1s ease;
        }
    </style>
</head>

<body>

    <div id="scene" class="scene"></div>

    <div class="container" id="main">
        <h1>CHAOS</h1>

        <p>
            You probably shouldn't press this.
        </p>

        <button id="chaosButton">
            CHAOS
        </button>

        <div id="counter">
            Chaos Level: <span id="count">0</span>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
